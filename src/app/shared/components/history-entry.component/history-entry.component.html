<div class="container">
    <div class="qr-info">
        <span>{{formatUrl(history().url)}}</span>
        <span>{{formatCreationTime(history().creationTime)}}</span>
    </div>

    <div class="action-options">
        <button class="ghost-button" (click)="copyURL(history().url)">Copy</button>
        <button class="ghost-button" (click)="regenerateQRCode()">Regenerate</button>
    </div>
</div>
