<div class="container">
    <span class="column">{{formatUrl(history().url)}}</span>
    <span class="column">{{history().creationTime}}</span>
    <div class="action-options column">
        <button (click)="copyURL(history().url)">Copy</button>
        <button (click)="regenerateQRCode()">Regenerate QR code</button>
    </div>
</div>
