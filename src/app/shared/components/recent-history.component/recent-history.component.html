<div class="container">
    <div class="header">
        <h4 class="heading">Recent QR Codes</h4>
        <div class="header-action-buttons">
            <button (click)="goToViewAllPage()">View All</button>
            <button (click)="clearAllHistory()">Clear All</button>
        </div>
    </div>

    <div class="history-list">
        @for(historyEntry of historyList().slice(-recentHistoryEntryLimit).reverse(); track historyEntry.url) {
        <app-history-entry [history]="historyEntry"></app-history-entry>
        }
    </div>

</div>
