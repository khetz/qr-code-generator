<div class="container">
    <h4>QR Code Preview</h4>
    <div class="qr-code-section">
        <qrcode [qrdata]="qrData" [width]="150"></qrcode>
    </div>
    <div class="qr-download-sharing">
        <button>Download (PNG)</button>
        <button>Download (SVG)</button>
        <div class="sharing">
            <button>Copy URL</button>
            <button>Share</button>
        </div>
    </div>
</div>
