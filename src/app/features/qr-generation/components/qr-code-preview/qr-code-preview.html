<div class="container">
    <h4>QR Code Preview</h4>
    <div class="qr-code-section">
        <qrcode cssClass="code" [qrdata]="qrData" [width]="qrCodeWidth" [allowEmptyString]="true"></qrcode>
    </div>
    <div class="qr-download-sharing">
        <div class="download">
            <button>Download (PNG)</button>
            <button>Download (SVG)</button>
        </div>

        <div class="sharing">
            <button>Copy URL</button>
            <button>Share</button>
        </div>
    </div>
</div>
